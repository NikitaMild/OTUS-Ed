[pytest]
# Здесь запускаем pytest из корня занятия: pytest.ini делает конфигурацию явной.
testpaths = .

# ВАЖНО: маски заданы точно, а не как practice_*.py.
# Маска practice_*.py заставила бы pytest импортировать practice_1/2/3,
# которые требуют установленного selenium и браузера Chrome -> ошибки коллекции.
python_files = test_*.py practice_4_pytest_with_logging.py
python_classes = Test*
python_functions = test_*

addopts =
    -v
    --strict-markers
    --tb=short

# ---------- Логирование тестов ----------
# log_level влияет на уровень перехвата логов (root/логгеры) во время тестов.
log_level = DEBUG

# Живой вывод логов в консоль во время прогона (аналог pytest -o log_cli=true)
log_cli = true
log_cli_level = DEBUG
log_cli_format = %(asctime)s [%(levelname)s] (%(name)s) %(filename)s::%(lineno)d:: %(message)s
log_cli_date_format = %H:%M:%S

# Файловый лог: именно он наполняет suite_4.log (раньше файл оставался пустым).
log_file = suite_4.log
log_file_mode = w
log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)s] (%(name)s) %(filename)s::%(lineno)d:: %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S
